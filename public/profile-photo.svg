<svg width="840" height="980" viewBox="0 0 840 980" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Tanmoy Mondal profile placeholder</title>
  <desc id="desc">Stylized professional avatar placeholder with TM initials in neon cyber style.</desc>
  <defs>
    <linearGradient id="bg" x1="110" y1="40" x2="720" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1A37"/>
      <stop offset="0.6" stop-color="#0A1021"/>
      <stop offset="1" stop-color="#050912"/>
    </linearGradient>
    <linearGradient id="halo" x1="220" y1="150" x2="620" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#36F3FF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#B172FF" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="glow" x="120" y="40" width="600" height="840" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feBlend mode="screen" in="SourceGraphic" in2="blur"/>
    </filter>
  </defs>

  <rect width="840" height="980" rx="42" fill="url(#bg)"/>
  <rect x="38" y="38" width="764" height="904" rx="30" stroke="#4EEBFF" stroke-opacity="0.25" stroke-width="2"/>

  <g filter="url(#glow)">
    <circle cx="420" cy="310" r="170" fill="url(#halo)" fill-opacity="0.52"/>
    <path d="M190 760C206 626 293 536 420 536C547 536 634 626 650 760" stroke="#62FBA8" stroke-opacity="0.65" stroke-width="22" stroke-linecap="round"/>
    <circle cx="420" cy="308" r="114" fill="#0B1228" stroke="#8AE8FF" stroke-opacity="0.7" stroke-width="14"/>
  </g>

  <path d="M246 770L595 770" stroke="#7ED8FF" stroke-opacity="0.42" stroke-width="2"/>
  <path d="M246 790L595 790" stroke="#7ED8FF" stroke-opacity="0.22" stroke-width="2"/>

  <text x="420" y="897" text-anchor="middle" fill="#CCF8FF" font-size="88" font-family="JetBrains Mono, monospace" letter-spacing="14">TM</text>
</svg>
