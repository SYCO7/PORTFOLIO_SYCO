name: CodeMoat

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: SYCO7/codemoat@v1
        with:
          api-key: ${{ secrets.CODEMOAT_API_KEY }}
